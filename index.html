<!DOCTYPE html>
<head>
    <!--HTML for fitness webapp, current names and data may be placeholders.-->
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Superstar Fitness Tracker</title>
    <!--Links to stylesheets and JS-->
    <link href="css/resetStyle.css" rel="stylesheet">
    <link href="css/mainStyle.css" rel="stylesheet">
    <link href="css/tableStyle.css" rel="stylesheet">
    <link href="css/formStyle.css" rel="stylesheet">
    <script src="js/sfMain.js" defer></script>
    <script src="js/sfLog.js" defer></script>
</head>
<body>
    <header>
        <img src="images/sfHeader.png" alt="website header displaying app logo" id="webHeader"/>
        <div id="todayDate">Today's Date</div>
    </header>
   
    <button onclick="showHideForm(1)" id="formButton">Log an Activity</button>

    <form id="activityForm" onsubmit="return validateForm()">
        <label for="actType">Activity Type*</label>
        <input name="Type" id="actType" type="text" list="typeList" required/>
        <datalist id ="typeList">
            <option value="Workout"/>
            <option value="Habit"/>
        </datalist>

        <label for="actName">Activity Name*</label>
        <input name="activityName" id="actName" type="text" required/>

        <label for="amnt">Duration/Quantity*</label>
        <input name="Amount" id="amnt" type="text" required/>

        <label for="Date">Date*</label>
        <input name="time" id="Date" type="datetime" placeholder="dd-mm-yyyy" required/>

        <label for="extraNotes">Notes</label>
        <textarea name="Notes" id="extraNotes" type="text" placeholder="None"></textarea>

        <p><input type="submit" value="Submit" id="formButton"/></p>
    </form>

    <h1>Activity Log</h1>
    <table>
        <thead>
            <tr>
                <th>Activity Type</th>
                <th>Name</th>
                <th>Duration/Quantity</th>
                <th id="dateCol">Date</th>
                <th>Notes</th>
            </tr>
        </thead>
        <tbody id="activityLog">

        </tbody>
    </table>

    <h1>My Statistics</h1>
    <h2>Total:</h2>
    <h2>Monthly Total:</h2>
    <h2>Weekly Total: </h2>
    <h2>Average Duration: </h2>
    <h2>Average Duration/Quantity: </h2>
    <h2>Monthly Average: </h2>
    <h2>Weekly Average: </h2>

    <h1>My Goals</h1>

    <h2>Current Streak: 2 days</h2>
</body>
