<!DOCTYPE html>
<head>
    <!--HTML for fitness webapp, current names and data may be placeholders.-->
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Superstar Fitness Tracker</title>
    <!--Links to stylesheets and JS-->
    <link href="css/resetStyle.css" rel="stylesheet">
    <link href="css/mainStyle.css" rel="stylesheet">
    <link href="css/tableStyle.css" rel="stylesheet">
    <link href="css/formStyle.css" rel="stylesheet">
    <script src="js/sfMain.js" defer></script>
    <script src="js/sfStats.js" defer></script>
    <script src="js/sfLog.js" defer></script>
</head>
<body>
    <header>
        <!--I drew this header in MSpaint, the background is sourced from Figma's gradient generator-->
        <img src="images/sfHeader.png" alt="website header displaying app logo" id="webHeader"/>
        <div id="todayDate">Today's Date</div>
    </header>

    <div id="userStreak"></div>
   
    <button onclick="showHideForm(1)" class="formButton">Log an Activity</button>

    <form id="activityForm" onsubmit="return validateFormInputs()">
        <label for="actType">Activity Type*</label>
        <input name="Type" id="actType" type="text" list="typeList" class="formInput" required/>
        <datalist id ="typeList">
            <option value="Workout"/>
            <option value="Habit"/>
        </datalist>

        <label for="actName">Activity Name*</label>
        <input name="activityName" id="actName" type="text" class="formInput" required/>

        <label for="amnt">Duration/Quantity*</label>
        <div class="inputContainer">
            <input name="Amount" id="amnt" type="text" class="unitInput" required/>
            <input name="amntUnit" id="actUnit" type="text" list="unitList" class="unitInput1" required/>
            <datalist id ="unitList">
                <option value="Minutes"/>
                <option value="km"/>
                <option value="Sessions"/>
            </datalist>
        </div>

        <label for="Date">Date*</label>
        <input name="time" id="Date" type="date" class="formInput" required/>

        <label for="extraNotes">Notes</label>
        <textarea name="Notes" id="extraNotes" type="text" placeholder="None"></textarea>

        <p><input type="submit" value="Submit" class="formButton"/></p>
    </form>

    <h1>Activity Log</h1>
    <input name="Search" id="searchKey" type="text" placeholder="Search...">
    <select id="filterKey">
        <option value="">All</option>
        <option value="Workout">Workout</option>
        <option value="Habit">Habit</option>
    </select>
    <select id="filterTime">
        <option value="">All Time</option>
        <option value="byWeek">This Week</option>
        <option value="byMonth">This Month  </option>
    </select>
    <table>
        <colgroup>
            <col span="5">
            <col span="1" class="editDelete">
        </colgroup>
        <thead>
            <tr>
                <th>Activity Type</th>
                <th>Name</th>
                <th>Duration/Quantity</th>
                <th id="dateCol">Date</th>
                <th>Notes</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="activityLog">

        </tbody>
    </table>

    <h1>My Statistics</h1>
    <div id="activityStats"></div>

    <h1>My Goals</h1>
    <button onclick="showHideForm(2)" class="formButton">Set a New Goal</button>
    <form id="goalForm">
        <label for="goalType">Is your goal a workout or habit goal?*</label>
        <input name="gType" id="goalType" type="text" list="gTypeList" class="formInput" required/>
        <datalist id ="gTypeList">
            <option value="Workout"/>
            <option value="Habit"/>
        </datalist>
        <label for="goalName">Which activity is goal related to?*</label>
        <input name="gName" id="goalName" type="text" class="formInput" required/>

        <label for="goalTarget">What is your fitness goal?*</label>
        <div class="inputContainer">
        <input name="gTime" id="goalTarget" type="text" class="unitInput" required/>
        <input name="gUnit" id="goalUnit" type="text" list="gUnitList" class="unitInput1" required/>
        <datalist id ="gUnitList">
            <option value="Minutes"/>
            <option value="km"/>
            <option value="Sessions"/>
        </datalist>
        </div>
        <label for="goalPeriod">In what time do you want to achieve this goal?*</label>
        <input name="gPeriod" id="goalPeriod" type="text" list="gPeriodList" class="formInput" required/>
            <datalist id ="gPeriodList">
            <option value="A Week"/>
            <option value="A Month"/>
        </datalist>
        <p><input type="submit" value="Add Goal" class="formButton"></p>
    </form>

    <div id="goalList"></div>

    <button id="killButton" onclick="deleteAllData()">Clear All Data</button>
</body>
